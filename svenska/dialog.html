<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog Session — Svenska</title>

<!-- Firebase SDK (compat) — loaded lazily; harmless if you never use shared sessions.
     Drop these script tags if you don't want any external CDN load. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1e2330;
    --ink: #e8ecf3;
    --ink-dim: #98a2b3;
    --border: #262c3a;
    --a: #2563eb;       /* speaker A bubble */
    --a-ink: #ffffff;
    --b: #047857;       /* speaker B bubble */
    --b-ink: #ffffff;
    --sv: #2a3142;
    --sv-ink: #cfe8ff;
    --warn: #f59e0b;
    --accent-2: #93c5fd;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --panel-2: #f1f3f8;
      --ink: #131722;
      --ink-dim: #555c6a;
      --border: #e5e8ef;
      --a: #2563eb;
      --a-ink: #ffffff;
      --b: #047857;
      --b-ink: #ffffff;
      --sv: #eef3fb;
      --sv-ink: #1d4ed8;
      --accent-2: #1d4ed8;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; }
  body { padding: 16px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--ink-dim); font-size: 13px; margin-bottom: 16px; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-2); text-decoration: none; font-size: 13px; margin-bottom: 12px; }
  .back-link:hover { text-decoration: underline; }

  .toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; position: sticky; top: 8px; z-index: 10;
  }
  button {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--border); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent-2); color: white; border-color: transparent; }
  .seed { color: var(--ink-dim); font-size: 12px; margin-left: auto; font-family: ui-monospace, Menlo, monospace; }

  .dialog {
    margin-top: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: stretch;
    cursor: pointer;
  }
  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.4;
    font-size: 15px;
    word-wrap: break-word;
    display: block;
    min-height: 44px;
    box-sizing: border-box;
    border: 2px solid transparent;
  }
  .bubble.en {
    user-select: none;
    color: white;
  }
  .bubble.en.a { background: var(--a); }
  .bubble.en.b { background: var(--b); }

  /* Muted EN bubble — visible only to the teacher (or to the student
     for lines they don't yet see). Grey fill, speaker-coloured border. */
  .bubble.en.muted {
    background: var(--panel-2);
    color: var(--ink);
  }
  .bubble.en.muted.a { border-color: var(--a); }
  .bubble.en.muted.b { border-color: var(--b); }
  .bubble.en.muted.a .who { background: var(--a); color: white; }
  .bubble.en.muted.b .who { background: var(--b); color: white; }
  .who {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    background: rgba(255,255,255,0.22);
    color: white;
    padding: 2px 8px;
    border-radius: 999px;
    margin-right: 10px;
    vertical-align: 2px;
  }
  .bubble.sv {
    background: var(--sv);
    color: transparent;
    font-style: italic;
    transition: color 0.12s ease;
  }
  .row.revealed .bubble.sv { color: var(--sv-ink); }

  .meta {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--ink-dim);
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .meta .tag {
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
  }

  footer { color: var(--ink-dim); font-size: 12px; margin: 24px 0 8px; text-align: center; }
  kbd { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11px; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; gap: 4px; }
  }

  /* ---- Session bar (shared mode) ---- */
  .session-bar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
    margin-bottom: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 13px;
  }
  .role-badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: white;
  }
  .role-badge.teacher { background: var(--a); }
  .role-badge.student { background: var(--b); }
  .role-badge.single  { background: var(--ink-dim); }
  .session-bar code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .conn { margin-left: auto; color: var(--ink-dim); font-size: 12px; }
  .conn.connected::before { content: "● "; color: #10b981; }
  .conn.connecting::before { content: "● "; color: #f59e0b; }
  .conn.offline::before { content: "● "; color: #ef4444; }

  /* ---- Teacher controls ---- */
  .teacher-controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-top: 10px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 13px;
  }
  .teacher-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .teacher-controls input[type="checkbox"] { accent-color: var(--accent-2); }
  .teacher-controls select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }

  /* ---- Placeholder bubble (English text hidden from student) ---- */
  .bubble.en.placeholder .text { visibility: hidden; }
  .bubble.en.placeholder::after {
    content: "···";
    font-size: 18px;
    letter-spacing: 8px;
    color: var(--ink-dim);
    margin-left: -4px;
  }

  /* SV reveal — text is transparent until the bubble has .revealed */
  .bubble.sv.revealed { color: var(--sv-ink); }

  /* Indicator (teacher-only): green border on SV bubbles currently
     visible to the student. (EN bubbles instead change their fill —
     see .bubble.en.muted above.) */
  .bubble.sv.revealed-by-student-view {
    border-color: #10b981;
  }
  /* Per-bubble pointer cursor when the teacher can click it */
  .role-teacher .bubble.en,
  .role-teacher .bubble.sv,
  .role-single .bubble.en,
  .role-single .bubble.sv { cursor: pointer; }
  .role-student .bubble.en,
  .role-student .bubble.sv { cursor: default; }

  /* ---- Setup notice (config missing) ---- */
  .setup-notice {
    background: #422006;
    color: #fde68a;
    border: 1px solid #b45309;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .setup-notice a { color: #fde68a; }
</style>
</head>
<body>

<a class="back-link" href="index.html">← Svenska</a>
<h1>Dialog Session</h1>
<div class="sub" id="page-sub">Tap a coloured bubble to reveal the English; tap a grey bubble to reveal the Swedish. Or use <b>Reveal next →</b> (or <kbd>space</kbd>) to step through.</div>

<div id="setup-notice" class="setup-notice" hidden></div>

<div id="session-bar" class="session-bar"></div>

<div class="toolbar">
  <button id="prev">← Prev</button>
  <button id="reveal-all">Reveal all</button>
  <button id="hide-all">Hide all</button>
  <button id="reveal-next">Reveal next →</button>
  <button id="next" class="primary">Next dialog →</button>
  <span class="seed" id="seed"></span>
</div>

<div id="teacher-controls" class="teacher-controls" hidden>
  <label><input type="checkbox" id="show-all-toggle"> Show all to student</label>
  <label><input type="checkbox" id="strict-toggle"> Strict (hide student lines too)</label>
  <label>Student speaks as
    <select id="student-speaks">
      <option value="A">A</option>
      <option value="B" selected>B</option>
    </select>
  </label>
  <button id="copy-link">Copy student link</button>
  <span id="copy-status" style="color:var(--ink-dim);font-size:12px;"></span>
</div>

<div class="dialog" id="dialog"></div>

<div class="meta" id="meta"></div>

<footer id="page-footer">Press <kbd>space</kbd> to reveal next, <kbd>shift</kbd>+<kbd>space</kbd> to step back, <kbd>→</kbd>/<kbd>←</kbd> for next/prev dialog</footer>

<script>
"use strict";

// =====================================================================
// POOLS — every entry carries pre-baked grammar forms so templates
// never have to compose Swedish on the fly. Add entries freely; just
// make sure each entry has the fields the template expects.
// =====================================================================

const POOLS = {

  // ---- FOOD (countable + uncountable). ----
  // Fields:
  //   en_indef / sv_indef   = "an apple" / "ett äpple"
  //   en_def   / sv_def     = "the apple" / "äpplet"
  //   en_likes / sv_likes   = how it appears after "I like ..." (plural/uncount)
  //   en_pron  / sv_pron    = "it" / "den" or "det"
  //   En_pron  / Sv_pron    = capitalized for sentence-start
  //   gender                = "en" | "ett"
  food: [
    { en_indef:"a banana", en_def:"the banana", sv_indef:"en banan", sv_def:"bananen",
      en_likes:"bananas", sv_likes:"bananer", en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"an orange", en_def:"the orange", sv_indef:"en apelsin", sv_def:"apelsinen",
      en_likes:"oranges", sv_likes:"apelsiner", en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"an apple", en_def:"the apple", sv_indef:"ett äpple", sv_def:"äpplet",
      en_likes:"apples", sv_likes:"äpplen", en_pron:"it", sv_pron:"det", En_pron:"It", Sv_pron:"Det", gender:"ett" },
    { en_indef:"a pizza", en_def:"the pizza", sv_indef:"en pizza", sv_def:"pizzan",
      en_likes:"pizza", sv_likes:"pizza", en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a hamburger", en_def:"the hamburger", sv_indef:"en hamburgare", sv_def:"hamburgaren",
      en_likes:"hamburgers", sv_likes:"hamburgare", en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a piece of carrot cake", en_def:"the carrot cake", sv_indef:"en bit morotskaka", sv_def:"morotskakan",
      en_likes:"carrot cake", sv_likes:"morotskaka", en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a piece of kladdkaka", en_def:"the kladdkaka", sv_indef:"en bit kladdkaka", sv_def:"kladdkakan",
      en_likes:"kladdkaka", sv_likes:"kladdkaka", en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a sandwich", en_def:"the sandwich", sv_indef:"en smörgås", sv_def:"smörgåsen",
      en_likes:"sandwiches", sv_likes:"smörgåsar", en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"an ice cream", en_def:"the ice cream", sv_indef:"en glass", sv_def:"glassen",
      en_likes:"ice cream", sv_likes:"glass", en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a coffee", en_def:"the coffee", sv_indef:"en kaffe", sv_def:"kaffet",
      en_likes:"coffee", sv_likes:"kaffe", en_pron:"it", sv_pron:"det", En_pron:"It", Sv_pron:"Det", gender:"ett" },
    { en_indef:"a tea", en_def:"the tea", sv_indef:"ett te", sv_def:"teet",
      en_likes:"tea", sv_likes:"te", en_pron:"it", sv_pron:"det", En_pron:"It", Sv_pron:"Det", gender:"ett" },
    { en_indef:"a salad", en_def:"the salad", sv_indef:"en sallad", sv_def:"salladen",
      en_likes:"salad", sv_likes:"sallad", en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
  ],

  // ---- PLACE ----
  // Fields:
  //   en_indef/sv_indef, en_def/sv_def
  //   at_en/at_sv   = the natural "at/in/on" phrase ("at the office" / "på kontoret")
  //   to_en/to_sv   = "to the office" / "till kontoret"
  //   from_en/from_sv = "from the office" / "från kontoret"
  //   gender, sv_pron, Sv_pron
  place: [
    { en_indef:"an office", en_def:"the office", sv_indef:"ett kontor", sv_def:"kontoret",
      at_en:"at the office", at_sv:"på kontoret", to_en:"to the office", to_sv:"till kontoret", from_en:"from the office", from_sv:"från kontoret",
      gender:"ett", sv_pron:"det", Sv_pron:"Det", is_business:true },
    { en_indef:"a kitchen", en_def:"the kitchen", sv_indef:"ett kök", sv_def:"köket",
      at_en:"in the kitchen", at_sv:"i köket", to_en:"to the kitchen", to_sv:"till köket", from_en:"from the kitchen", from_sv:"från köket",
      gender:"ett", sv_pron:"det", Sv_pron:"Det" },
    { en_indef:"a café", en_def:"the café", sv_indef:"ett café", sv_def:"caféet",
      at_en:"at the café", at_sv:"på caféet", to_en:"to the café", to_sv:"till caféet", from_en:"from the café", from_sv:"från caféet",
      gender:"ett", sv_pron:"det", Sv_pron:"Det", is_business:true },
    { en_indef:"a hospital", en_def:"the hospital", sv_indef:"ett sjukhus", sv_def:"sjukhuset",
      at_en:"at the hospital", at_sv:"på sjukhuset", to_en:"to the hospital", to_sv:"till sjukhuset", from_en:"from the hospital", from_sv:"från sjukhuset",
      gender:"ett", sv_pron:"det", Sv_pron:"Det", is_business:true },
    { en_indef:"a meeting room", en_def:"the meeting room", sv_indef:"ett mötesrum", sv_def:"mötesrummet",
      at_en:"in the meeting room", at_sv:"i mötesrummet", to_en:"to the meeting room", to_sv:"till mötesrummet", from_en:"from the meeting room", from_sv:"från mötesrummet",
      gender:"ett", sv_pron:"det", Sv_pron:"Det" },
    { en_indef:"an airport", en_def:"the airport", sv_indef:"en flygplats", sv_def:"flygplatsen",
      at_en:"at the airport", at_sv:"på flygplatsen", to_en:"to the airport", to_sv:"till flygplatsen", from_en:"from the airport", from_sv:"från flygplatsen",
      gender:"en", sv_pron:"den", Sv_pron:"Den", is_business:true },
    { en_indef:"a store", en_def:"the store", sv_indef:"en affär", sv_def:"affären",
      at_en:"at the store", at_sv:"i affären", to_en:"to the store", to_sv:"till affären", from_en:"from the store", from_sv:"från affären",
      gender:"en", sv_pron:"den", Sv_pron:"Den", is_business:true },
    { en_indef:"a bus stop", en_def:"the bus stop", sv_indef:"en busshållplats", sv_def:"busshållplatsen",
      at_en:"at the bus stop", at_sv:"vid busshållplatsen", to_en:"to the bus stop", to_sv:"till busshållplatsen", from_en:"from the bus stop", from_sv:"från busshållplatsen",
      gender:"en", sv_pron:"den", Sv_pron:"Den" },
    { en_indef:"a gym", en_def:"the gym", sv_indef:"ett gym", sv_def:"gymmet",
      at_en:"at the gym", at_sv:"på gymmet", to_en:"to the gym", to_sv:"till gymmet", from_en:"from the gym", from_sv:"från gymmet",
      gender:"ett", sv_pron:"det", Sv_pron:"Det", is_business:true },
    { en_indef:"a library", en_def:"the library", sv_indef:"ett bibliotek", sv_def:"biblioteket",
      at_en:"at the library", at_sv:"på biblioteket", to_en:"to the library", to_sv:"till biblioteket", from_en:"from the library", from_sv:"från biblioteket",
      gender:"ett", sv_pron:"det", Sv_pron:"Det", is_business:true },
    { en_indef:"a park", en_def:"the park", sv_indef:"en park", sv_def:"parken",
      at_en:"in the park", at_sv:"i parken", to_en:"to the park", to_sv:"till parken", from_en:"from the park", from_sv:"från parken",
      gender:"en", sv_pron:"den", Sv_pron:"Den" },
    { en_indef:"a doctor", en_def:"the doctor", sv_indef:"en läkare", sv_def:"läkaren",
      at_en:"at the doctor's", at_sv:"hos läkaren", to_en:"to the doctor", to_sv:"till läkaren", from_en:"from the doctor", from_sv:"från läkaren",
      gender:"en", sv_pron:"den", Sv_pron:"Den" },
  ],

  // ---- OBJECT ----
  // Fields like food, plus en_mine/sv_mine ("mine" / "min" or "mitt"),
  // and en_my/sv_my ("my car" / "min bil") which uses the *naked* stem.
  object: [
    { en_indef:"a car", en_def:"the car", sv_indef:"en bil", sv_def:"bilen",
      en_my:"my car", sv_my:"min bil", en_mine:"mine", sv_mine:"min",
      en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a book", en_def:"the book", sv_indef:"en bok", sv_def:"boken",
      en_my:"my book", sv_my:"min bok", en_mine:"mine", sv_mine:"min",
      en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a key", en_def:"the key", sv_indef:"en nyckel", sv_def:"nyckeln",
      en_my:"my key", sv_my:"min nyckel", en_mine:"mine", sv_mine:"min",
      en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a phone", en_def:"the phone", sv_indef:"en telefon", sv_def:"telefonen",
      en_my:"my phone", sv_my:"min telefon", en_mine:"mine", sv_mine:"min",
      en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a bag", en_def:"the bag", sv_indef:"en väska", sv_def:"väskan",
      en_my:"my bag", sv_my:"min väska", en_mine:"mine", sv_mine:"min",
      en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a jacket", en_def:"the jacket", sv_indef:"en jacka", sv_def:"jackan",

      en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },

      en_pron:"it", sv_pron:"det", En_pron:"It", Sv_pron:"Det", gender:"ett" },
    { en_indef:"a computer", en_def:"the computer", sv_indef:"en dator", sv_def:"datorn",
      en_my:"my computer", sv_my:"min dator", en_mine:"mine", sv_mine:"min",
      en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a wallet", en_def:"the wallet", sv_indef:"en plånbok", sv_def:"plånboken",
      en_my:"my wallet", sv_my:"min plånbok", en_mine:"mine", sv_mine:"min",
      en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a charger", en_def:"the charger", sv_indef:"en laddare", sv_def:"laddaren",
      en_my:"my charger", sv_my:"min laddare", en_mine:"mine", sv_mine:"min",
      en_pron:"it", sv_pron:"den", En_pron:"It", Sv_pron:"Den", gender:"en" },
    { en_indef:"a glass", en_def:"the glass", sv_indef:"ett glas", sv_def:"glaset",
      en_my:"my glass", sv_my:"mitt glas", en_mine:"mine", sv_mine:"mitt",
      en_pron:"it", sv_pron:"det", En_pron:"It", Sv_pron:"Det", gender:"ett" },
  ],

  // ---- LOCATION-INSIDE-A-PLACE — small things found at a place ----
  // Used for "where is X? on the Y" / "next to Y". Pre-baked prepositional phrases.
  furniture: [
    { en_on:"on the table",       sv_on:"på bordet" },
    { en_on:"on the shelf",       sv_on:"på hyllan" },
    { en_on:"on the floor",       sv_on:"på golvet" },
    { en_on:"in the fridge",      sv_on:"i kylen" },
    { en_on:"in the microwave",   sv_on:"i mikron" },
    { en_on:"in the oven",        sv_on:"i ugnen" },

// =====================================================================
// ENGINE
// =====================================================================

// Simple seedable PRNG (mulberry32)
function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function cap(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function render(line, filled) {
  return line.replace(/\{(\w+)\.(\w+)(?:\|(\w+))?\}/g, (_, slot, prop, mod) => {
    const entry = filled[slot];
    if (!entry) throw new Error(`Unfilled slot: ${slot}`);
    let v = entry[prop];
    if (v == null) throw new Error(`Missing property '${prop}' on slot '${slot}' (entry: ${JSON.stringify(entry).slice(0,80)}...)`);
    if (mod === "cap") v = cap(v);
    return v;
  });
}

// Pick distinct entries when two slots share the same pool.
// Template extras:
//   - `sameCategory: ["c","c2"]`   — these slots all share the same `category`
//   - `where: { p: { is_business: true } }` — restrict slot `p` to pool entries
//     where every key matches the given value (e.g. is_business===true)
function pickSlots(template, rng) {
  const slots = template.slots || {};
  const sameCategory = template.sameCategory || [];
  const where = template.where || {};
  const filled = {};
  const usedByPool = {};

  for (const [slotName, poolName] of Object.entries(slots)) {
    const pool = POOLS[poolName];
    if (!pool) throw new Error(`Unknown pool: ${poolName}`);
    if (!usedByPool[poolName]) usedByPool[poolName] = new Set();

    // Start with every index, then narrow down.
    let allowed = pool.map((_, i) => i);

    // Apply `where` filter for this slot.
    if (where[slotName]) {
      const conds = Object.entries(where[slotName]);
      allowed = allowed.filter(i => conds.every(([k, v]) => pool[i][k] === v));
    }

    // Apply sameCategory constraint.
    if (sameCategory.includes(slotName)) {
      for (const peer of sameCategory) {
        if (peer !== slotName && filled[peer] && filled[peer].category) {
          const target = filled[peer].category;
          allowed = allowed.filter(i => pool[i].category === target);
          break;
        }
      }
    }

    if (allowed.length === 0) {
      throw new Error(`No pool entries match slot ${slotName} in template ${template.id}`);
    }

    let idx, tries = 0;
    do {
      idx = allowed[Math.floor(rng() * allowed.length)];
      tries++;
      if (tries > 50) break;
    } while (usedByPool[poolName].has(idx) && usedByPool[poolName].size < allowed.length);

    usedByPool[poolName].add(idx);
    filled[slotName] = pool[idx];
  }
  return filled;
}

function buildDialog(templateIdx, seed) {
  const template = TEMPLATES[templateIdx];
  const rng = makeRng(seed);
  const filled = pickSlots(template, rng);
  return {
    templateIdx,
    seed,
    templateId: template.id,
    tags: template.tags || [],
    speakers: template.speakers,
    en: template.en.map(line => render(line, filled)),
    sv: template.sv.map(line => render(line, filled)),
  };
}

// =====================================================================

function initFirebase() {
  if (role === "single") return;
  if (typeof firebase === "undefined") {
    console.error("[E01] Backend SDK didn't load");
    role = "single";
    showSetupNotice("Something went wrong: Code-E01");
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    sessionRef = firebase.database().ref("sessions/" + SESSION_ID);
    setConnStatus("connecting");
    firebase.database().ref(".info/connected").on("value", snap => {
      setConnStatus(snap.val() ? "connected" : "offline");
    });
    sessionRef.on("value", snap => {
      const data = snap.val();
      if (data && data.templateIdx != null) {
        // strip passcode field — it's only used for rule validation
        const { passcode, ...rest } = data;
        state = Object.assign({
          revealed_en: [], revealed_sv: [],
          showAll: false, strictMode: false, studentSpeaks: "B"
        }, rest);
        // Migrate old single-flag `revealed[]` to the two-side fields.
        if (Array.isArray(state.revealed) && (!Array.isArray(state.revealed_en) || state.revealed_en.length === 0)) {
          state.revealed_en = state.revealed.slice();
          state.revealed_sv = state.revealed.slice();
        }
        delete state.revealed;
        applyAndRender();
      } else if (role === "teacher") {
        // empty session — teacher seeds it with the first dialog
        nextDialog();
      }
    });
  } catch (e) {
    console.error("[E02] Init failed:", e);
    role = "single";
    showSetupNotice("Something went wrong: Code-E02");
  }
}

function writeShared() {
  if (sessionRef && role === "teacher") {
    const passcode = localStorage.getItem("svenska_passcode") || "";
    sessionRef.set({ ...state, passcode }).catch(e => {
      if (String(e).includes("PERMISSION_DENIED")) {
        // Wrong passcode — prompt for it again
        console.error("[E03] Write rejected (passcode mismatch):", e);
        localStorage.removeItem("svenska_passcode");
        const pc = prompt("Wrong passcode — re-enter:");
        if (pc) {
          localStorage.setItem("svenska_passcode", pc);
          writeShared();
        }
      } else {
        console.error("[E04] Write failed:", e);
        alert("Something went wrong: Code-E04");
      }
    });
  }
}


// =====================================================================
// VISIBILITY LOGIC
// =====================================================================
function visibilityFor(i, sp) {
  if (role === "single") {
    // single-user: EN always, SV on tap
    return { en: true, sv: !!state.revealed_sv[i] };
  }
  if (role === "teacher") {
    // teacher sees everything (the indicator dots show what student sees)
    return { en: true, sv: true };
  }
  // student
  if (state.showAll) return { en: true, sv: true };
  const en = !!state.revealed_en[i]
          || (!state.strictMode && sp === state.studentSpeaks);
  const sv = !!state.revealed_sv[i];
  return { en, sv };
}


// =====================================================================
// RENDER
// =====================================================================
function applyAndRender() {
  if (state.templateIdx == null) {
    const dialogEl = document.getElementById("dialog");
    if (role === "student") {
      dialogEl.innerHTML = '<div style="text-align:center;color:var(--ink-dim);padding:40px;font-size:14px;">Waiting for teacher to start a dialog…</div>';
    } else {
      dialogEl.innerHTML = "";
    }
    document.getElementById("meta").innerHTML = "";
    document.getElementById("seed").textContent = "";
    return;
  }
  const tpl = TEMPLATES[state.templateIdx];
  const n = tpl.speakers.length;

  // make sure the reveal arrays have the right length
  if (!Array.isArray(state.revealed_en) || state.revealed_en.length !== n) {
    state.revealed_en = new Array(n).fill(false);
  }
  if (!Array.isArray(state.revealed_sv) || state.revealed_sv.length !== n) {
    state.revealed_sv = new Array(n).fill(false);
  }

  const d = buildDialog(state.templateIdx, state.seed);
  renderDialog(d);
  syncTeacherControls();
  syncToolbar();
}

function renderDialog(d) {
  const dialogEl = document.getElementById("dialog");
  const metaEl = document.getElementById("meta");
  const seedEl = document.getElementById("seed");
  dialogEl.innerHTML = "";
  dialogEl.classList.remove("role-single", "role-teacher", "role-student");
  dialogEl.classList.add("role-" + role);

  d.speakers.forEach((sp, i) => {
    const vis = visibilityFor(i, sp);

    const row = document.createElement("div");
    row.className = "row";
    row.dataset.speaker = sp;

    // EN bubble
    const enBubble = document.createElement("div");
    enBubble.className = "bubble en " + sp.toLowerCase();
    if (!vis.en) enBubble.classList.add("placeholder");
    // Muted styling (grey fill, coloured border) when the line isn't
    // currently revealed to the student. Teacher always has the text
    // visible — only the fill changes.
    if (role === "teacher" && !state.revealed_en[i]) enBubble.classList.add("muted");
    else if (role === "student" && !vis.en) enBubble.classList.add("muted");

    const who = document.createElement("span");
    who.className = "who";
    who.textContent = sp;
    const text = document.createElement("span");
    text.className = "text";
    text.textContent = d.en[i];
    enBubble.appendChild(who);
    enBubble.appendChild(text);

    // SV bubble
    const svBubble = document.createElement("div");
    svBubble.className = "bubble sv";
    if (vis.sv) svBubble.classList.add("revealed");
    if (role === "teacher" && state.revealed_sv[i]) svBubble.classList.add("revealed-by-student-view");
    svBubble.textContent = d.sv[i];

    // Per-bubble tap handlers
    if (role === "teacher") {
      enBubble.onclick = (e) => { e.stopPropagation(); toggleRevealEn(i); };
      svBubble.onclick = (e) => { e.stopPropagation(); toggleRevealSv(i); };
    } else if (role === "single") {
      // single user: clicking anywhere reveals/hides the Swedish (legacy)
      const tap = (e) => { e.stopPropagation(); toggleRevealSv(i); };
      enBubble.onclick = tap;
      svBubble.onclick = tap;
    }

    row.appendChild(enBubble);
    row.appendChild(svBubble);
    dialogEl.appendChild(row);
  });

  metaEl.innerHTML = "";
  const tplTag = document.createElement("span");
  tplTag.className = "tag";
  tplTag.textContent = "template: " + d.templateId;
  metaEl.appendChild(tplTag);
  d.tags.forEach(t => {
    const span = document.createElement("span");
    span.className = "tag";
    span.textContent = t;
    metaEl.appendChild(span);
  });

  if (role === "single") {
    seedEl.textContent = `#${cursor + 1} · seed ${d.seed.toString(36)}`;
  } else {
    seedEl.textContent = `seed ${d.seed.toString(36)}`;
  }
}


// =====================================================================
// COMMANDS
// =====================================================================
function nextDialog() {
  if (role === "student") return;
  const ti = Math.floor(Math.random() * TEMPLATES.length);
  const seed = Math.floor(Math.random() * 0xFFFFFFFF);
  const n = TEMPLATES[ti].speakers.length;
  state = Object.assign({}, state, {
    templateIdx: ti,
    seed,
    revealed_en: new Array(n).fill(false),
    revealed_sv: new Array(n).fill(false),
    showAll: false,
  });
  if (cursor < history.length - 1) history.splice(cursor + 1);
  history.push(JSON.parse(JSON.stringify(state)));
  cursor = history.length - 1;
  writeShared();
  applyAndRender();
}

function prevDialog() {
  if (role === "student") return;
  if (cursor > 0) {
    cursor--;
    state = JSON.parse(JSON.stringify(history[cursor]));
    writeShared();
    applyAndRender();
  }
}

function toggleRevealEn(i) {
  if (role === "student") return;
  state.revealed_en = state.revealed_en.slice();
  state.revealed_en[i] = !state.revealed_en[i];
  writeShared();
  applyAndRender();
}

function toggleRevealSv(i) {
  if (role === "student") return;
  state.revealed_sv = state.revealed_sv.slice();
  state.revealed_sv[i] = !state.revealed_sv[i];
  writeShared();
  applyAndRender();
}

function revealAll() {
  if (role === "student") return;
  state.revealed_en = state.revealed_en.map(() => true);
  state.revealed_sv = state.revealed_sv.map(() => true);
  writeShared();
  applyAndRender();
}

function hideAll() {
  if (role === "student") return;
  state.revealed_en = state.revealed_en.map(() => false);
  state.revealed_sv = state.revealed_sv.map(() => false);
  state.showAll = false;
  writeShared();
  applyAndRender();
}

// Advance the linear reveal:  line 0 EN → line 0 SV → line 1 EN → line 1 SV → …
function revealNextStep() {
  if (role === "student") return;
  for (let i = 0; i < state.revealed_en.length; i++) {
    if (!state.revealed_en[i]) {
      state.revealed_en = state.revealed_en.slice();
      state.revealed_en[i] = true;
      writeShared();
      applyAndRender();
      return;
    }
    if (!state.revealed_sv[i]) {
      state.revealed_sv = state.revealed_sv.slice();
      state.revealed_sv[i] = true;
      writeShared();
      applyAndRender();
      return;
    }
  }
  // Everything already revealed — no-op.
}

// Step back one reveal:  hide the most-recently-revealed bubble.
function hideLastStep() {
  if (role === "student") return;
  for (let i = state.revealed_sv.length - 1; i >= 0; i--) {
    if (state.revealed_sv[i]) {
      state.revealed_sv = state.revealed_sv.slice();
      state.revealed_sv[i] = false;
      writeShared();
      applyAndRender();
      return;
    }
    if (state.revealed_en[i]) {
      state.revealed_en = state.revealed_en.slice();
      state.revealed_en[i] = false;
      writeShared();
      applyAndRender();
      return;
    }
  }
}

function setShowAll(on) {
  if (role === "student") return;
  state.showAll = !!on;
  writeShared();
  applyAndRender();
}

function setStrict(on) {
  if (role === "student") return;
  state.strictMode = !!on;
  writeShared();
  applyAndRender();
}

function setStudentSpeaks(sp) {
  if (role === "student") return;
  state.studentSpeaks = sp;
  writeShared();
  applyAndRender();
}


// =====================================================================
// TOOLBAR & UI SYNC
// =====================================================================
function syncToolbar() {
  const isStudent = role === "student";
  document.getElementById("prev").disabled        = isStudent || cursor <= 0;
  document.getElementById("next").disabled        = isStudent;
  document.getElementById("reveal-all").disabled  = isStudent;
  document.getElementById("hide-all").disabled    = isStudent;
  document.getElementById("reveal-next").disabled = isStudent;
}

function syncTeacherControls() {
  if (role !== "teacher") return;
  document.getElementById("show-all-toggle").checked = !!state.showAll;
  document.getElementById("strict-toggle").checked = !!state.strictMode;
  document.getElementById("student-speaks").value = state.studentSpeaks || "B";
}

function renderSessionBar() {
  const bar = document.getElementById("session-bar");
  bar.innerHTML = "";

  const badge = document.createElement("span");
  badge.className = "role-badge " + role;
  badge.textContent = role;
  bar.appendChild(badge);

  if (role === "single") {
    const hint = document.createElement("span");
    hint.style.color = "var(--ink-dim)";
    hint.textContent = "Single-user mode";
    bar.appendChild(hint);
    return;
  }

  const idSpan = document.createElement("span");
  idSpan.innerHTML = `session <code>${escapeHtml(SESSION_ID)}</code>`;
  bar.appendChild(idSpan);

  const conn = document.createElement("span");
  conn.className = "conn connecting";
  conn.id = "conn-status";
  conn.textContent = "connecting";
  bar.appendChild(conn);
}

function setConnStatus(status) {
  const el = document.getElementById("conn-status");
  if (!el) return;
  el.className = "conn " + status;
  el.textContent = status;
}

function showSetupNotice(html) {
  const n = document.getElementById("setup-notice");
  n.hidden = false;
  n.innerHTML = html;
}


// =====================================================================
// WIRE UP DOM
// =====================================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

document.getElementById("next").onclick        = nextDialog;
document.getElementById("prev").onclick        = prevDialog;
document.getElementById("reveal-all").onclick  = revealAll;
document.getElementById("hide-all").onclick    = hideAll;
document.getElementById("reveal-next").onclick = revealNextStep;

window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (role === "student") return;
  if (e.key === "ArrowRight") { e.preventDefault(); nextDialog(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prevDialog(); }
  else if (e.key === " ") {
    e.preventDefault();
    if (e.shiftKey) hideLastStep(); else revealNextStep();
  }
});

// Teacher-only controls
if (role === "teacher") {
  document.getElementById("teacher-controls").hidden = false;
  document.getElementById("show-all-toggle").onchange = e => setShowAll(e.target.checked);
  document.getElementById("strict-toggle").onchange   = e => setStrict(e.target.checked);
  document.getElementById("student-speaks").onchange  = e => setStudentSpeaks(e.target.value);
  document.getElementById("copy-link").onclick = async () => {
    const u = new URL(window.location.href);
    u.searchParams.set("role", "student");
    try {
      await navigator.clipboard.writeText(u.toString());
      const s = document.getElementById("copy-status");
      s.textContent = "copied!";
      setTimeout(() => s.textContent = "", 1500);
    } catch {
      prompt("Copy this link:", u.toString());
    }
  };
}

if (role === "student") {
  // Hide controls the student shouldn't touch
  document.getElementById("next").style.display        = "none";
  document.getElementById("prev").style.display        = "none";
  document.getElementById("reveal-all").style.display  = "none";
  document.getElementById("hide-all").style.display    = "none";
  document.getElementById("reveal-next").style.display = "none";
  // Replace the instructional sub with something role-appropriate;
  // hide the keyboard footer hint (the shortcuts don't apply).
  const sub = document.getElementById("page-sub");
  if (sub) sub.textContent = "Lines will appear here as the teacher reveals them.";
  const ft = document.getElementById("page-footer");
  if (ft) ft.style.display = "none";
}


// =====================================================================
// INIT
// =====================================================================
// INIT — sessions are created on the landing page; this page only runs
// against an existing session (or in single-user mode if no session
// parameter is present and the backend isn't reachable).
// =====================================================================
if (_setupWarning) showSetupNotice(_setupWarning);

// If a session URL parameter is present and the backend is configured,
// we run in teacher/student mode. Otherwise — including the no-param
// case — drop into single-user practice. (To create a new shared
// session, the landing page handles it.)
if (role === "teacher" && !localStorage.getItem("svenska_passcode")) {
  const pc = prompt("Enter the session passcode:");
  if (pc) localStorage.setItem("svenska_passcode", pc);
}

renderSessionBar();
syncToolbar();

if (role === "single") {
  nextDialog();
} else {
  initFirebase();
}
</script>
</body>
</html>
